# iOS UI performance on PRs is run from the main orchestrator (rn.yml → ios-performance after ios-dev).
# This file is kept for manual re-runs only.

name: RN Performance (PR) — manual

on:
  workflow_dispatch:
    inputs:
      perf_metrics_mode:
        description: full (launch + CPU/memory) or launch (smoke)
        type: choice
        options: [full, launch]
        default: full
      ios_dev_simulator_artifact_name:
        description: Optional ios-dev-simulator-* artifact name (leave empty to build app in-job)
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: write

jobs:
  ui-performance:
    uses: ./.github/workflows/rn-job-ios-performance.yml
    with:
      perf_metrics_mode: ${{ inputs.perf_metrics_mode }}
      ios_dev_simulator_artifact_name: ${{ inputs.ios_dev_simulator_artifact_name }}
      pr_number: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}
    permissions:
      contents: read
      pull-requests: write
    secrets: inherit
